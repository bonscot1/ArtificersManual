<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ArtificersManual</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      body {
        margin: 0;
        background: #1a1510;
        color: #f5e8d2;
      }
      main {
        max-width: 800px;
        margin: 2rem auto;
        padding: 1.25rem;
        border: 1px solid #7a5c37;
        border-radius: 8px;
        background: #2a2118;
      }
      h1,
      h2 {
        color: #f0be6f;
      }
      ul {
        line-height: 1.6;
      }
      .pill {
        display: inline-block;
        margin: 0.2rem 0.2rem 0 0;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        border: 1px solid #a47b49;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ArtificersManual</h1>
      <p>A locally hosted D&D hub for your table.</p>

      <h2>Party Snapshot</h2>
      <ul>
        <li>Current quest: <strong>The Shattered Forge</strong></li>
        <li>Recommended level: <strong>5-7</strong></li>
        <li>Session prep reminder: torches, rope, healing potions</li>
      </ul>

      <h2>Quick References</h2>
      <span class="pill">Conditions</span>
      <span class="pill">Action Economy</span>
      <span class="pill">Spellcasting</span>
      <span class="pill">Travel Pace</span>
    </main>
  </body>
</html>
