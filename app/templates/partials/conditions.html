{% set ch = sheet.char %}
<section class="win" id="conditions">
  <div class="win-title">Conditions</div>
  <div class="win-body chips">
    {% for name in sheet.condition_names %}
    <button class="chip {% if name in sheet.conditions %}on{% endif %}" hx-post="/c/{{ ch.id }}/conditions" hx-vals='{"name": "{{ name }}"}' hx-target="#conditions" hx-swap="outerHTML" title="toggle">{{ name }}</button>
    {% endfor %}
  </div>
</section>
