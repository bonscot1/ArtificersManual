<div class="modal-backdrop">
  <div class="modal" data-mid="{{ m.id }}">
    <div class="modal-head">A message from the DM{% if more %} <span class="muted small">{{ more }} more waiting</span>{% endif %}</div>
    <div class="modal-text">{{ m.text }}</div>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    {% if m.kind == 'choice' %}
    <div class="modal-options">
      {% for o in m.options %}
      <button class="cast-opt big" hx-post="/c/{{ char.id }}/inbox/{{ m.id }}" hx-vals='{"answer": {{ o|tojson }}}' hx-target="#inbox" hx-swap="innerHTML">{{ o }}</button>
      {% endfor %}
    </div>
    {% elif m.kind == 'prompt' %}
    <form class="stack" hx-post="/c/{{ char.id }}/inbox/{{ m.id }}" hx-target="#inbox" hx-swap="innerHTML">
      <textarea name="answer" rows="3" autofocus placeholder="Your reply"></textarea>
      <button class="primary">Send reply</button>
    </form>
    {% else %}
    <form hx-post="/c/{{ char.id }}/inbox/{{ m.id }}" hx-target="#inbox" hx-swap="innerHTML">
      <button class="primary" autofocus>OK</button>
    </form>
    {% endif %}
  </div>
</div>
