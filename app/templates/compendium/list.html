{% extends "base.html" %}
{% block title %}{{ title }} - Artificer's Manual{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<ul class="results">
  {% for e in items %}<li><a href="{{ entity_url(kind, e) }}">{{ e.name }}</a> <span class="muted small">{{ e.source }}</span></li>{% endfor %}
</ul>
{% endblock %}
