<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Artificer's Manual{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/themes.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body hx-boost="false" {% if theme_style %}style="{{ theme_style }}" data-theme="{{ sheet.theme }}"{% endif %}>
<header class="topbar">
  <a class="brand" href="/">Artificer's Manual</a>
  <nav>
    <a href="/" {% if request.url.path == '/' %}class="on"{% endif %}>Party</a>
    <a href="/new" {% if request.url.path == '/new' %}class="on"{% endif %}>New character</a>
    <a href="/compendium" {% if request.url.path.startswith('/compendium') %}class="on"{% endif %}>Compendium</a>
    <a href="/rules" {% if request.url.path == '/rules' %}class="on"{% endif %}>Rules</a>
    {% if is_dm %}<a href="/dm" {% if request.url.path.startswith('/dm') %}class="on"{% endif %}>DM</a>{% endif %}
  </nav>
  <div class="who">
    {% if is_dm %}<a class="pill pill-dm" href="/dm">DM screen</a>{% elif settings.dm_password %}<a class="pill" href="/login">DM sign in</a>{% endif %}
    {% if signed_in %}
    <form method="post" action="/logout" class="inline"><button class="link">log out</button></form>
    {% endif %}
  </div>
</header>
<main class="{% block main_class %}{% endblock %}">
{% block content %}{% endblock %}
</main>
<div id="toast" class="toast" hidden></div>
{% if sheet and sheet.char and not is_dm %}
<div id="inbox" hx-get="/c/{{ sheet.char.id }}/inbox" hx-trigger="load, every 2s" hx-swap="innerHTML" hx-vals='js:{shown: (document.querySelector("#inbox .modal") || {dataset: {}}).dataset.mid || ""}'></div>
{% endif %}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var toast = document.getElementById("toast"), timer;
    document.body.addEventListener("toast", function (e) {
      toast.textContent = (e.detail && e.detail.value) || "Saved";
      toast.hidden = false;
      clearTimeout(timer);
      timer = setTimeout(function () { toast.hidden = true; }, 1400);
    });
    document.body.addEventListener("htmx:responseError", function (e) {
      toast.textContent = "Not saved (" + e.detail.xhr.status + ")";
      toast.hidden = false;
      clearTimeout(timer);
      timer = setTimeout(function () { toast.hidden = true; }, 2500);
    });
  });
</script>
</body>
</html>
